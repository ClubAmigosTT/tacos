name: Tacos iOS TestFlight

on:
  # Publicar es una acción manual para no compilar en cada push.
  workflow_dispatch:
    inputs:
      release_note:
        description: "Nota interna para identificar la ejecución"
        required: false
        default: "Tacos iOS release"
        type: string

permissions:
  contents: read

concurrency:
  group: tacos-ios-testflight
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.19.0"

jobs:
  preflight:
    name: Validar antes de usar macOS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_DEMO_MODE: "false"
      EAS_BUILD_PROFILE: production
      EAS_BUILD_PLATFORM: ios
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar variable de producción
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_PUBLIC_API_URL:-}" ]]; then
            echo "::error title=Falta la URL de producción::Configura EXPO_PUBLIC_API_URL en GitHub."
            exit 1
          fi
          if [[ "$EXPO_PUBLIC_API_URL" != https://* ]]; then
            echo "::error title=API de producción inválida::La URL debe usar HTTPS."
            exit 1
          fi

      - name: Typecheck y validaciones
        run: |
          pnpm typecheck
          pnpm smoke:config
          pnpm smoke:inputs

      - name: Validar configuración iOS de producción
        shell: bash
        run: |
          set -euo pipefail
          config_json="$(pnpm --filter @tacos/mobile exec expo config --type public --json)"
          node -e '
            const config = JSON.parse(process.argv[1]);
            if (config.ios?.bundleIdentifier !== "com.clubamigostt.tacos") throw new Error("Cambió el bundle ID de iOS");
            if (config.owner !== "clubamigostt") throw new Error("Cambió el propietario de Expo");
            if (config.extra?.eas?.projectId !== "155a5800-f93e-4680-9cc4-02450eb830b6") throw new Error("Cambió el proyecto EAS");
            if (config.ios?.supportsTablet !== false) throw new Error("La versión actual debe seguir siendo solo iPhone");
          ' "$config_json"

      - name: Validar catálogo y fotos locales
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/mobile/data/catalog.ts
          photos="$(find apps/mobile/assets/catalog-dummies -type f -name '*.jpg' | wc -l | tr -d ' ')"
          if ((photos < 27)); then
            echo "::error title=Faltan fotos locales::Se esperaban al menos 27 y se encontraron $photos."
            exit 1
          fi

      - name: Exportar bundle web
        run: pnpm --filter @tacos/mobile exec expo export --platform web

  build-and-submit:
    name: Compilar en macOS y subir a TestFlight
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_DEMO_MODE: "false"
      EAS_BUILD_PROFILE: production
      EAS_BUILD_PLATFORM: ios
      RELEASE_NOTE: ${{ inputs.release_note }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias JavaScript
        run: pnpm install --frozen-lockfile

      - name: Validar toolchain de Apple
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "SDK de iPhone: $sdk_version"
          sdk_major="${sdk_version%%.*}"
          if ((sdk_major < 26)); then
            echo "::error title=SDK de iOS no compatible::Se requiere iOS 26 o posterior."
            exit 1
          fi

      - name: Validar secretos sin imprimirlos
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_TEAM_ID APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID APPSTORE_API_PRIVATE_KEY APPLE_DISTRIBUTION_P12 APPLE_DISTRIBUTION_P12_PASSWORD APPLE_PROVISIONING_PROFILE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf "::error title=Faltan secretos::Configura en GitHub Actions: %s\n" "${missing[*]}"
            exit 1
          fi

      - name: Resolver versión y build monotónico
        shell: bash
        run: |
          set -euo pipefail
          config_json="$(pnpm --filter @tacos/mobile exec expo config --type public --json)"
          marketing_version="$(node -e 'const c=JSON.parse(process.argv[1]); process.stdout.write(c.version || "")' "$config_json")"
          if [[ ! "$marketing_version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error title=Versión inválida::$marketing_version"
            exit 1
          fi
          build_number="$(date +%s)$GITHUB_RUN_NUMBER"
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Generar proyecto iOS con Expo
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
          test -f Tacos.xcworkspace/contents.xcworkspacedata

      - name: Preparar firma y perfil
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/tacos-signing.keychain-db"
          keychain_password="$(uuidgen)"
          p12_path="$RUNNER_TEMP/tacos-distribution.p12"
          profile_path="$RUNNER_TEMP/tacos.mobileprovision"
          profile_plist="$RUNNER_TEMP/tacos-profile.plist"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          printf "%s" "$APPLE_DISTRIBUTION_P12" | base64 -D > "$p12_path"
          printf "%s" "$APPLE_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          mkdir -p "$profile_dir"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          echo "SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Archivar aplicación
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Tacos.xcworkspace \
            -scheme Tacos \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Tacos.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/TacosDerivedData" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.clubamigostt.tacos" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            clean archive

      - name: Exportar IPA
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.clubamigostt.tacos</key><string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          rm -rf "$RUNNER_TEMP/TacosExport"
          mkdir -p "$RUNNER_TEMP/TacosExport"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tacos.xcarchive" \
            -exportPath "$RUNNER_TEMP/TacosExport" \
            -exportOptionsPlist "$export_options"
          ipa_path="$RUNNER_TEMP/TacosExport/Tacos.ipa"
          if [[ ! -f "$ipa_path" ]]; then
            ipa_path="$(find "$RUNNER_TEMP/TacosExport" -maxdepth 1 -name "*.ipa" -print -quit)"
          fi
          test -n "$ipa_path" && test -f "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Subir build a TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "false"

      - name: Confirmar que Apple recibió el build
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_BUNDLE_ID: com.clubamigostt.tacos
          ASC_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const b64 = (v) => Buffer.from(v).toString("base64url");
          const key = (process.env.ASC_PRIVATE_KEY || "").replace(/\\n/g, "\n");
          const token = () => {
            const now = Math.floor(Date.now() / 1000);
            const h = b64(JSON.stringify({alg:"ES256",kid:process.env.ASC_KEY_ID,typ:"JWT"}));
            const p = b64(JSON.stringify({iss:process.env.ASC_ISSUER_ID,iat:now-30,exp:now+540,aud:"appstoreconnect-v1"}));
            const signer = crypto.createSign("SHA256");
            signer.update(h + "." + p);
            signer.end();
            const s = signer.sign({key:crypto.createPrivateKey(key),dsaEncoding:"ieee-p1363"});
            return h + "." + p + "." + b64(s);
          };
          (async () => {
            const url = "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]="
              + encodeURIComponent(process.env.ASC_BUNDLE_ID) + "&limit=1";
            const response = await fetch(url, {headers:{Authorization:"Bearer " + token()}});
            if (!response.ok) throw new Error("App Store Connect respondió HTTP " + response.status);
            const body = await response.json();
            if (!body.data?.length) throw new Error("La app no apareció en App Store Connect.");
            console.log("Apple recibió el envío para " + process.env.ASC_BUNDLE_ID + ".");
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE

      - name: Resumen
        if: success()
        shell: bash
        run: |
          {
            echo "## Tacos iOS"
            echo ""
            echo "Versión: $MARKETING_VERSION"
            echo "Build: $BUILD_NUMBER"
            echo "IPA compilado en macOS y enviado a App Store Connect."
            echo "Nota: $RELEASE_NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar credenciales temporales
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "$SIGNING_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
