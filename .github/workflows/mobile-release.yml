name: Mobile Release

on:
  workflow_run:
    workflows: [Tacos CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      submit_ios:
        description: Submit the iOS build to TestFlight
        required: true
        default: false
        type: boolean

concurrency:
  group: tacos-mobile-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.scope.outputs.mobile }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve source revision
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 2

      - name: Detect mobile release changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(apps/mobile/|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true' &&
      (github.event_name == 'workflow_dispatch' || vars.MOBILE_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["ios", "android"]') }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI_VERSION: 23.2.0
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Require Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required in the production GitHub environment." >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Validate mobile types
        working-directory: .
        run: pnpm --filter @tacos/mobile typecheck

      - name: Queue EAS production build
        env:
          AUTO_SUBMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.submit_ios || vars.IOS_AUTO_SUBMIT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(build --platform "${{ matrix.platform }}" --profile production --non-interactive --no-wait)
          if [ "${{ matrix.platform }}" = "ios" ] && [ "$AUTO_SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          pnpm dlx "eas-cli@$EAS_CLI_VERSION" "${args[@]}"
