name: Tacos CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tacos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm build:api

      - name: Export Expo web bundle
        run: pnpm --filter @tacos/mobile exec expo export --platform web
