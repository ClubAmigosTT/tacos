name: Tacos CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tacos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tacos
      NODE_ENV: test
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tacos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tacos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Hours filter smoke test
        run: pnpm smoke:hours

      - name: Radar filter smoke test
        run: pnpm smoke:radar

      - name: Input validation smoke test
        run: pnpm smoke:inputs

      - name: Expo production config smoke test
        run: pnpm smoke:config

      - name: Render Free policy smoke test
        run: pnpm smoke:render-free

      - name: Build API
        run: pnpm build:api

      - name: Production environment guard smoke test
        run: pnpm smoke:production

      - name: Auth security smoke test
        run: pnpm smoke:security

      - name: Apply PostgreSQL migrations
        run: pnpm --filter @tacos/api migrate

      - name: Render maintenance smoke
        run: pnpm --filter @tacos/api nightly

      - name: API smoke test
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_EMAILS=admin-smoke@example.com pnpm --filter @tacos/api start > /tmp/tacos-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/health > /dev/null
          pnpm smoke:api
          pnpm smoke:admin

      - name: Export Expo web bundle
        run: pnpm --filter @tacos/mobile exec expo export --platform web
