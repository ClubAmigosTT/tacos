name: Tacos CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tacos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API
        run: pnpm build:api

      - name: API smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @tacos/api start > /tmp/tacos-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/health > /dev/null
          pnpm smoke:api

      - name: Export Expo web bundle
        run: pnpm --filter @tacos/mobile exec expo export --platform web
