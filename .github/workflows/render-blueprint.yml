name: Validate Render Blueprint

on:
  # Manual while this private repository is using the account's included
  # GitHub Actions minutes. Local smoke tests remain the deployment gate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_CLI_VERSION: v2.26.0
      # GitHub Actions does not expose the `secrets` context directly inside
      # step-level `if` expressions. Project the optional secrets into the
      # environment first, then gate the authenticated validator on `env`.
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Render CLI
        shell: bash
        run: |
          set -euo pipefail
          version="${RENDER_CLI_VERSION#v}"
          curl -sSfL "https://github.com/render-oss/cli/releases/download/${RENDER_CLI_VERSION}/cli_${version}_linux_amd64.zip" -o /tmp/render.zip
          mkdir -p /tmp/render
          unzip -q /tmp/render.zip -d /tmp/render
          sudo mv "/tmp/render/cli_${RENDER_CLI_VERSION}" /usr/local/bin/render
          sudo chmod +x /usr/local/bin/render
          render --version

      - name: Validate YAML locally
        run: ruby -e "require 'yaml'; YAML.load_file('render.yaml'); YAML.load_file('render.free-demo.yaml'); YAML.load_file('.github/workflows/render-blueprint.yml'); puts 'Blueprint YAML syntax passed'"

      # The remote validator also checks conflicts against a Render workspace.
      # Keep it opt-in so public forks and first-time local CI stay green.
      - name: Validate Blueprint with Render
        if: ${{ env.RENDER_API_KEY != '' && env.RENDER_WORKSPACE_ID != '' }}
        run: |
          render blueprints validate render.yaml --workspace "$RENDER_WORKSPACE_ID"
          render blueprints validate render.free-demo.yaml --workspace "$RENDER_WORKSPACE_ID"
