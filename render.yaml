services:
  - type: web
    name: tacos-web
    runtime: static
    # Static sites are also available on Render's Free plan and provide the
    # HTTPS origin used by account verification and password reset links.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tacos/mobile exec expo export --platform web
    staticPublishPath: apps/mobile/dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          name: tacos-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_DEMO_MODE
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: tacos-api
    runtime: node
    region: ohio
    # Free tier keeps the first release cost-free. It sleeps after inactivity.
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tacos/api build
    # Free web services do not support Render's paid-only preDeployCommand.
    # Run idempotent migrations before starting the API instead.
    startCommand: pnpm --filter @tacos/api migrate && pnpm catalog:ensure:osm && pnpm --filter @tacos/api start
    # GitHub-hosted Actions for this private repository share the account's
    # monthly allowance. Deploy directly from each commit so production does
    # not stop when that free allowance is exhausted.
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Use the persistent Neon PostgreSQL/PostGIS connection string.
        # Keeping the database outside Render avoids the 30-day lifetime of
        # Render's free PostgreSQL instances.
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: PUBLIC_API_URL
        fromService:
          name: tacos-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_WEB_URL
        fromService:
          name: tacos-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          name: tacos-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: REQUIRE_EMAIL_VERIFICATION
        # La primera versión debe permitir crear la cuenta sin depender de
        # Resend; la verificación por correo se puede activar cuando el
        # proveedor de correo esté configurado y probado en producción.
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_BUCKET_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      # Image uploads stay optional until an S3/R2 bucket is configured.
      - key: STORAGE_REQUIRED
        value: "false"
      - key: CATALOG_FILE
        value: catalog/osm-cdmx-edomex.json
      - key: CATALOG_FEED_URL
        sync: false
      - key: CATALOG_SOURCE_NAME
        value: osm-cdmx-edomex
      - key: CATALOG_SOURCE_URL
        value: https://www.openstreetmap.org
      - key: CATALOG_SOURCE_LICENSE
        value: ODbL 1.0
      - key: CATALOG_ALLOW_PARTIAL
        value: "true"
      - key: CATALOG_RECONCILE
        value: "false"
      - key: ALLOW_DEMO_CATALOG
        value: "false"
