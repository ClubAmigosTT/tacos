services:
  - type: web
    name: tacos-api
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tacos/api build
    startCommand: pnpm --filter @tacos/api start
    preDeployCommand: pnpm --filter @tacos/api migrate
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tacos-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: PUBLIC_API_URL
        value: https://tacos-api.onrender.com
      - key: APP_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tacos-keyvalue
          property: connectionString
      - key: STORAGE_BUCKET_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: STORAGE_REQUIRED
        value: "true"
      - key: CATALOG_FILE
        value: catalog/branches.json
      - key: CATALOG_FEED_URL
        sync: false
      - key: CATALOG_SOURCE_NAME
        sync: false
      - key: CATALOG_SOURCE_URL
        sync: false
      - key: CATALOG_SOURCE_LICENSE
        sync: false
      - key: ALLOW_DEMO_CATALOG
        value: "false"
  - type: worker
    name: tacos-worker
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tacos/api build
    startCommand: pnpm --filter @tacos/api worker
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tacos-postgres
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: tacos-api
          envVarKey: JWT_SECRET
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tacos-keyvalue
          property: connectionString
  - type: cron
    name: tacos-nightly
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    schedule: "0 8 * * *"
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tacos/api build
    startCommand: pnpm --filter @tacos/api nightly
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tacos-postgres
          property: connectionString
  - type: cron
    name: tacos-catalog-sync
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    schedule: "30 8 * * *"
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tacos/api build
    startCommand: pnpm catalog:import
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tacos-postgres
          property: connectionString
      - key: CATALOG_FEED_URL
        sync: false
      - key: CATALOG_SOURCE_NAME
        sync: false
      - key: CATALOG_SOURCE_URL
        sync: false
      - key: CATALOG_SOURCE_LICENSE
        sync: false
      - key: CATALOG_REPLACE_DEMO
        value: "true"
  - type: keyvalue
    name: tacos-keyvalue
    region: ohio
    plan: 256mb
    ipAllowList: []
databases:
  - name: tacos-postgres
    region: ohio
    plan: 0.5c-1g
    postgresMajorVersion: "18"
    diskSizeGB: 15
