services:
  - type: web
    name: tacos-api
    runtime: node
    region: ohio
    # Free tier keeps the first release cost-free. It sleeps after inactivity.
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tacos/api build
    # Free web services do not support Render's paid-only preDeployCommand.
    # Run idempotent migrations before starting the API instead.
    startCommand: pnpm --filter @tacos/api migrate && pnpm --filter @tacos/api start
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tacos-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: PUBLIC_API_URL
        value: https://tacos-api.onrender.com
      - key: APP_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_BUCKET_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      # Image uploads stay optional until an S3/R2 bucket is configured.
      - key: STORAGE_REQUIRED
        value: "false"
      - key: CATALOG_FILE
        value: catalog/branches.json
      - key: CATALOG_FEED_URL
        sync: false
      - key: CATALOG_SOURCE_NAME
        sync: false
      - key: CATALOG_SOURCE_URL
        sync: false
      - key: CATALOG_SOURCE_LICENSE
        sync: false
      - key: ALLOW_DEMO_CATALOG
        value: "false"
databases:
  - name: tacos-postgres
    region: ohio
    # Free Postgres is temporary (30 days), 1 GB, and has no backups.
    plan: free
    postgresMajorVersion: "18"
