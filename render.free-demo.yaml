# Cost-free demo deployment. This file is intentionally separate from the
# production-safe render.yaml: it has no paid resources or external secrets,
# enables the three clearly seeded demo places, and disables email delivery
# until a verified Resend account is configured.
services:
  - type: web
    name: tacos-api-free
    runtime: node
    region: ohio
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tacos/api build
    # Free web services do not support Render's paid-only preDeployCommand.
    startCommand: pnpm --filter @tacos/api migrate && pnpm --filter @tacos/api start
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tacos-postgres-free
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        value: https://tacos-api-free.onrender.com
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: STORAGE_REQUIRED
        value: "false"
      - key: CATALOG_FILE
        value: catalog/branches.json
      - key: ALLOW_DEMO_CATALOG
        value: "true"
databases:
  - name: tacos-postgres-free
    region: ohio
    plan: free
    postgresMajorVersion: "18"
